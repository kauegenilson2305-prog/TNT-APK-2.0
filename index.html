
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT WIRE V31 - Gerador de Key</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #fff;
      background: radial-gradient(circle at top, #102b58, #050914 65%);
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 32px 24px;
      text-align: center;
      background: rgba(8, 17, 36, 0.96);
      border: 1px solid #087cff;
      border-radius: 18px;
      box-shadow: 0 0 28px rgba(0, 119, 255, 0.25);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #168cff;
      border-radius: 50%;
      color: #39a5ff;
      font-size: 25px;
      font-weight: 900;
      text-shadow: 0 0 12px #168cff;
      box-shadow: 0 0 22px rgba(0, 132, 255, 0.25);
    }

    h1 {
      color: #35a2ff;
      font-size: 27px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a9bad4;
      font-size: 14px;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    #generateBtn {
      color: #fff;
      background: linear-gradient(90deg, #075ee8, #079cff);
      box-shadow: 0 0 18px rgba(0, 119, 255, 0.25);
    }

    #generateBtn:hover {
      filter: brightness(1.15);
    }

    #keyArea {
      display: none;
      margin-top: 22px;
    }

    .key-label {
      color: #9db4d5;
      font-size: 12px;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
    }

    #keyDisplay {
      padding: 16px 8px;
      margin-bottom: 14px;
      border: 1px solid #168cff;
      border-radius: 9px;
      background: #050d1d;
      color: #48b2ff;
      font-size: 19px;
      font-weight: bold;
      overflow-wrap: anywhere;
      user-select: all;
    }

    #copyBtn {
      color: #06101f;
      background: #38d9ff;
    }

    #copyBtn:hover {
      background: #79e7ff;
    }

    #message {
      min-height: 18px;
      margin-top: 12px;
      color: #70e8a0;
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      color: #667d9e;
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">V31</div>

    <h1>TNT WIRE</h1>
    <p class="subtitle">GERADOR DE KEY V31</p>

    <button id="generateBtn" onclick="generateKey()">
      GERAR KEY
    </button>

    <section id="keyArea">
      <p class="key-label">SUA KEY</p>
      <div id="keyDisplay">TNT_APK_V31</div>

      <button id="copyBtn" onclick="copyKey()">
        COPIAR KEY
      </button>

      <p id="message" aria-live="polite"></p>
    </section>

    <p class="footer">TNT WIRE • VERSÃO 31</p>
  </main>

  <script>
    const KEY = "TNT_APK_V31";

    function generateKey() {
      document.getElementById("keyDisplay").textContent = KEY;
      document.getElementById("keyArea").style.display = "block";
      document.getElementById("message").textContent = "";
    }

    async function copyKey() {
      const message = document.getElementById("message");

      try {
        await navigator.clipboard.writeText(KEY);
        message.textContent = "KEY COPIADA COM SUCESSO!";
      } catch (error) {
        const textArea = document.createElement("textarea");
        textArea.value = KEY;
        textArea.style.position = "fixed";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.select();

        const copied = document.execCommand("copy");
        textArea.remove();

        message.textContent = copied
          ? "KEY COPIADA COM SUCESSO!"
          : "Não foi possível copiar. Selecione e copie a key manualmente.";
      }
    }
  </script>
</body>
</html>
