
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080000">
<title>FFH4X PRIME - Painel Online</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: #050000;
  overflow-x: hidden;
}

/* FUNDO COMPLETO COM CAVEIRAS */
.fundo {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    linear-gradient(rgba(5,0,0,.48), rgba(5,0,0,.65)),
    url("caveira.jpg");
  background-size: cover, 175px 175px;
  background-position: center, center;
  background-repeat: no-repeat, repeat;
  filter: saturate(1.4);
  animation: fundoVivo 8s ease-in-out infinite alternate;
}

@keyframes fundoVivo {
  from { filter: brightness(.55) saturate(1.2); }
  to { filter: brightness(.85) saturate(1.7); }
}

/* ILUMINAÇÃO VERMELHA */
.luz {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 10% 20%, rgba(255,0,0,.25), transparent 35%),
    radial-gradient(ellipse at 90% 80%, rgba(255,0,0,.22), transparent 40%);
  animation: luz 4s infinite alternate;
}

@keyframes luz {
  from { opacity: .4; }
  to { opacity: 1; }
}

/* CANVAS DE PARTÍCULAS */
#particulas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 2;
  pointer-events: none;
}

/* CONTEÚDO */
.conteudo {
  position: relative;
  z-index: 3;
  min-height: 100vh;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 35px 16px;
}

.painel {
  width: 100%;
  max-width: 430px;
  padding: 35px 25px;
  text-align: center;
  background: rgba(5,0,0,.79);
  backdrop-filter: blur(7px);
  border: 2px solid #ff1616;
  border-radius: 22px;
  box-shadow:
    0 0 18px #ff0000,
    0 0 45px rgba(255,0,0,.45),
    inset 0 0 30px rgba(255,0,0,.13);
  animation: entrada 1s ease, pulsar 3s infinite alternate;
}

@keyframes entrada {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulsar {
  from { border-color: #a90000; }
  to { border-color: #ff4141; }
}

.logo {
  width: 145px;
  height: 145px;
  object-fit: contain;
  mix-blend-mode: screen;
  filter: drop-shadow(0 0 15px red);
  animation: flutuar 3s ease-in-out infinite;
}

@keyframes flutuar {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

h1 {
  font-size: clamp(29px, 8vw, 38px);
  font-weight: 900;
  font-style: italic;
  margin-top: 12px;
  text-shadow: 0 0 12px red;
}

h1 span {
  color: #ff1717;
}

.subtitulo {
  color: #ffaaaa;
  letter-spacing: 4px;
  margin-top: 12px;
  font-size: 14px;
}

.status {
  display: inline-block;
  margin: 27px 0;
  padding: 12px 20px;
  border: 1px solid #ff2929;
  border-radius: 30px;
  color: #ff6969;
  box-shadow: 0 0 15px rgba(255,0,0,.5);
}

.descricao {
  color: #eee;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 28px;
}

.botao {
  width: 100%;
  padding: 19px 10px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(120deg,#ff3030,#a00000);
  color: white;
  font-size: 19px;
  font-weight: 900;
  letter-spacing: 3px;
  box-shadow: 0 0 18px red;
  cursor: pointer;
  transition: .3s;
}

.botao:hover {
  transform: scale(1.04);
  box-shadow: 0 0 35px red;
}

.botao:active {
  transform: scale(.97);
}

.aviso {
  color: #aaa;
  font-size: 12px;
  margin-top: 25px;
}

.rodape {
  color: #ff5252;
  letter-spacing: 3px;
  font-size: 12px;
  margin-top: 24px;
}

/* CELULARES */
@media(max-width:480px) {
  .conteudo {
    padding: 25px 13px;
  }

  .painel {
    padding: 28px 19px;
  }
}

</style>
</head>

<body>

<div class="fundo"></div>
<div class="luz"></div>
<canvas id="particulas"></canvas>

<main class="conteudo">

  <section class="painel">

    <img src="caveira.jpg" class="logo" alt="FFH4X Prime">

    <h1>FFH4X <span>PRIME</span></h1>

    <div class="subtitulo">PAINEL ONLINE</div>

    <div class="status">● SISTEMA ONLINE</div>

    <p class="descricao">
      Bem-vindo ao FFH4X Prime!<br>
      Clique no botão abaixo para liberar seu acesso.
    </p>

    <button class="botao" onclick="gerarKey()">
      GERAR KEY
    </button>

    <div class="aviso">
      Complete a etapa de acesso para continuar.
    </div>

    <div class="rodape">
      FFH4X PRIME © 2026
    </div>

  </section>

</main>

<script>
function gerarKey() {
  window.location.href =
  "https://alpharede.com/McI7FizXaTA";
}

/* PARTÍCULAS E FAÍSCAS */
const canvas = document.getElementById("particulas");
const ctx = canvas.getContext("2d");

let pontos = [];

function ajustar() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function criar() {
  pontos = [];
  for(let i=0;i<100;i++) {
    pontos.push({
      x:Math.random()*innerWidth,
      y:Math.random()*innerHeight,
      r:Math.random()*2.5+1,
      v:Math.random()*1.5+.3,
      a:Math.random()
    });
  }
}

function animar() {
  ctx.clearRect(0,0,innerWidth,innerHeight);

  pontos.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,${Math.floor(p.a*30)},20,.9)`;
    ctx.shadowBlur = 18;
    ctx.shadowColor = "red";
    ctx.fill();

    p.y -= p.v;
    p.x += Math.sin(p.y*.012)*.5;

    if(p.y < -5) {
      p.y = innerHeight+5;
      p.x = Math.random()*innerWidth;
    }
  });

  ctx.shadowBlur = 0;
  requestAnimationFrame(animar);
}

window.addEventListener("resize",()=>{
  ajustar();
  criar();
});

ajustar();
criar();
animar();
</script>

</body>
</html>
