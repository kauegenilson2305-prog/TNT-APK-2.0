<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT APK 2.0</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px 20px;
      background: #171717;
      border-radius: 18px;
      text-align: center;
    }

    h1 {
      margin: 0 0 25px;
    }

    #key {
      min-height: 58px;
      padding: 18px 10px;
      margin-bottom: 20px;
      background: #242424;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #gerar {
      background: #fff;
      color: #000;
    }

    #copiar {
      background: #333;
      color: #fff;
      display: none;
    }

    #status {
      min-height: 20px;
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>TNT APK 2.0</h1>

    <div id="key"></div>

    <button id="gerar">GERAR KEY</button>

    <button id="copiar">COPIAR</button>

    <div id="status"></div>
  </div>

  <script>
    const key = "TNT-APK-KEY-GRATIS-V6";

    const keyElement = document.getElementById("key");
    const gerarButton = document.getElementById("gerar");
    const copiarButton = document.getElementById("copiar");
    const statusElement = document.getElementById("status");

    gerarButton.addEventListener("click", function () {
      keyElement.textContent = key.replace(/\s+/g, "");
      copiarButton.style.display = "block";
      statusElement.textContent = "";
    });

    copiarButton.addEventListener("click", async function () {
      const cleanKey = key.replace(/\s+/g, "");

      try {
        await navigator.clipboard.writeText(cleanKey);
      } catch (e) {
        const area = document.createElement("textarea");
        area.value = cleanKey;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }

      statusElement.textContent = "KEY COPIADA!";

      setTimeout(function () {
        statusElement.textContent = "";
      }, 1500);
    });
  </script>

</body>
</html>
