<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNT APK 2.0</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(circle at 20% 20%, rgba(0, 120, 255, .20), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(0, 180, 255, .15), transparent 30%),
    linear-gradient(135deg, #020711, #001b3d, #020711);
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  width: 92%;
  max-width: 430px;
  text-align: center;
}

.logo {
  font-size: 42px;
  font-weight: 900;
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(0, 140, 255, .7);
}

.logo span {
  color: #008cff;
}

.subtitle {
  color: #8993a3;
  letter-spacing: 4px;
  font-size: 14px;
  margin-bottom: 18px;
}

.online {
  color: #00e676;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 25px;
}

.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  margin-right: 7px;
  border-radius: 50%;
  background: #00e676;
  box-shadow: 0 0 12px #00e676;
}

.card {
  background: rgba(7, 12, 22, .95);
  border: 1px solid rgba(0, 140, 255, .4);
  border-radius: 25px;
  padding: 35px 25px;
  box-shadow: 0 0 35px rgba(0, 100, 255, .15);
}

.card h2 {
  font-size: 27px;
  margin-bottom: 12px;
}

.description {
  color: #8993a3;
  line-height: 1.5;
  margin-bottom: 28px;
}

.generate {
  width: 100%;
  padding: 19px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(135deg, #006eff, #00a8ff);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 22px rgba(0, 130, 255, .45);
}

.generate:active {
  transform: scale(.98);
}

#result {
  display: none;
  margin-top: 22px;
  padding: 18px;
  border-radius: 13px;
  border: 1px solid #008cff;
  background: rgba(0, 100, 200, .12);
}

.key-label {
  color: #8993a3;
  font-size: 13px;
  margin-bottom: 8px;
}

#key {
  color: #00a8ff;
  font-size: 18px;
  font-weight: bold;
  word-break: break-all;
  text-shadow: 0 0 10px rgba(0, 160, 255, .6);
}

.networks {
  margin-top: 30px;
}

.network-title {
  color: #8993a3;
  font-size: 13px;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

.network-button {
  display: block;
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-weight: bold;
  transition: .2s;
}

.whatsapp {
  background: #128c4a;
  box-shadow: 0 0 15px rgba(18, 140, 74, .3);
}

.youtube {
  background: #d90000;
  box-shadow: 0 0 15px rgba(217, 0, 0, .3);
}

.network-button:active {
  transform: scale(.98);
}

.footer {
  margin-top: 25px;
  color: #646d7a;
  font-size: 12px;
}

.footer strong {
  color: #008cff;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    TNT <span>APK 2.0</span>
  </div>

  <div class="subtitle">
    GERADOR DE KEY
  </div>

  <div class="online">
    <span class="dot"></span>
    ONLINE
  </div>

  <div class="card">

    <h2>Gere sua Key</h2>

    <p class="description">
      Gere sua key gratuitamente para acessar o TNT APK 2.0.
    </p>

    <button class="generate" onclick="gerarKey()">
      🔑 GERAR UMA KEY
    </button>

    <div id="result">

      <div class="key-label">
        SUA KEY FOI GERADA:
      </div>

      <div id="key"></div>

    </div>

    <div class="networks">

      <div class="network-title">
        ENTRE NAS NOSSAS REDES
      </div>

      <a
        class="network-button whatsapp"
        href="https://whatsapp.com/channel/0029Vb7b86gLo4hktDKFZ63x"
        target="_blank"
        rel="noopener noreferrer"
      >
        🟢 ENTRAR NO CANAL DO WHATSAPP
      </a>

      <a
        class="network-button youtube"
        href="https://youtube.com/@tntapk2.0?si=n9vIQ3Nx5t93lImk"
        target="_blank"
        rel="noopener noreferrer"
      >
        🔴 ENTRAR NO CANAL DO YOUTUBE
      </a>

    </div>

  </div>

  <div class="footer">
    CRIADO POR <strong>TNT APK 2.0</strong>
  </div>

</div>

<script>

function gerarKey() {

  const key = "TNT-APK-KEY-GRATIS-SAFE-V7";

  document.getElementById("key").textContent = key;

  document.getElementById("result").style.display = "block";

}

</script>

</body>
</html>
