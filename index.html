
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080000">
<title>FFH4X Prime | Painel Online</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.85)),
        url("banner.png") center center / cover fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    animation: energiaFundo 5s infinite alternate;
}

@keyframes energiaFundo {
    from { background-color: #080000; }
    to { background-color: #350000; }
}

/* Canvas de animação */
#efeitoFundo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* Brilho vermelho no fundo */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(
        circle at center,
        transparent 10%,
        rgba(0,0,0,.65) 100%
    );
    pointer-events: none;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 390px;
    padding: 28px 23px;
    text-align: center;
    background: rgba(10, 0, 0, .88);
    border: 2px solid #ff1717;
    border-radius: 18px;
    box-shadow:
        0 0 15px #ff0000,
        0 0 35px rgba(255,0,0,.55),
        inset 0 0 20px rgba(255,0,0,.12);
    animation: entrada 1s ease, pulsar 3s infinite alternate;
}

@keyframes entrada {
    from { opacity: 0; transform: scale(.85); }
    to { opacity: 1; transform: scale(1); }
}

@keyframes pulsar {
    from {
        box-shadow: 0 0 12px red, 0 0 25px rgba(255,0,0,.3);
    }
    to {
        box-shadow: 0 0 25px red, 0 0 50px rgba(255,0,0,.6);
    }
}

.logo {
    width: 145px;
    height: 145px;
    object-fit: contain;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px #ff1717);
    mix-blend-mode: screen;
}

h1 {
    font-size: 34px;
    font-weight: 900;
    font-style: italic;
    color: white;
    text-shadow: 0 0 8px red, 0 0 20px red;
    letter-spacing: 2px;
}

h1 span {
    color: #ff1717;
}

.subtitulo {
    color: #ffb0b0;
    font-size: 13px;
    margin-top: 9px;
    margin-bottom: 25px;
    letter-spacing: 2px;
}

.status {
    display: inline-block;
    padding: 8px 15px;
    margin-bottom: 22px;
    border: 1px solid #ff2525;
    border-radius: 20px;
    color: #ff5555;
    font-size: 12px;
    box-shadow: 0 0 10px rgba(255,0,0,.4);
}

.descricao {
    color: #ddd;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.botao {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 9px;
    color: white;
    background: linear-gradient(135deg, #ff3030, #a00000);
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 0 15px #ff0000;
    transition: .25s;
}

.botao:hover {
    transform: scale(1.04);
    box-shadow: 0 0 28px #ff0000;
}

.botao:active {
    transform: scale(.97);
}

.aviso {
    color: #999;
    font-size: 11px;
    margin-top: 20px;
}

.rodape {
    margin-top: 17px;
    color: #ff4444;
    font-size: 11px;
    letter-spacing: 2px;
}
</style>
</head>

<body>

<canvas id="efeitoFundo"></canvas>

<div class="container">

    <img src="caveira.png" class="logo" alt="FFH4X Prime">

    <h1>FFH4X <span>PRIME</span></h1>

    <div class="subtitulo">PAINEL ONLINE</div>

    <div class="status">● SISTEMA ONLINE</div>

    <p class="descricao">
        Bem-vindo ao FFH4X Prime!<br>
        Clique no botão abaixo para liberar seu acesso.
    </p>

    <button class="botao" onclick="gerarKey()">
        GERAR KEY
    </button>

    <div class="aviso">
        Complete a etapa de acesso para continuar.
    </div>

    <div class="rodape">
        FFH4X PRIME © 2026
    </div>

</div>

<script>
function gerarKey() {
    window.location.href =
    "https://alpharede.com/McI7FizXaTA";
}

// ANIMAÇÃO DE PARTÍCULAS VERMELHAS
const canvas = document.getElementById("efeitoFundo");
const ctx = canvas.getContext("2d");

let particulas = [];

function ajustarTela() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", ajustarTela);
ajustarTela();

function criarParticulas() {
    particulas = [];

    for (let i = 0; i < 90; i++) {
        particulas.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            tamanho: Math.random() * 2.5 + 1,
            velocidade: Math.random() * 1.5 + 0.4,
            brilho: Math.random()
        });
    }
}

criarParticulas();

function animarFundo() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    particulas.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(255, ${Math.floor(p.brilho * 45)}, 20, 0.9)`;
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff0000";
        ctx.fill();

        p.y -= p.velocidade;
        p.x += Math.sin(p.y * 0.01) * 0.5;

        if (p.y < -5) {
            p.y = window.innerHeight + 5;
            p.x = Math.random() * window.innerWidth;
        }
    });

    ctx.shadowBlur = 0;
    requestAnimationFrame(animarFundo);
}

animarFundo();
</script>

</body>
</html>
