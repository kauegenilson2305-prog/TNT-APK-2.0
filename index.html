<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TNT WIRE - Gerador de Key</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top, #123d75 0%, transparent 45%),
        #050914;
    }

    .container {
      width: 100%;
      max-width: 390px;
      padding: 30px 22px;
      text-align: center;
      background: rgba(9, 20, 42, 0.96);
      border: 1px solid #1677ff;
      border-radius: 18px;
      box-shadow: 0 0 28px rgba(0, 119, 255, 0.24);
    }

    .logo {
      width: 72px;
      height: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 18px;
      border: 2px solid #1685ff;
      border-radius: 50%;
      color: #58b4ff;
      font-size: 25px;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(0, 119, 255, 0.3);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 25px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin-bottom: 25px;
      color: #a8b9d3;
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      color: #ffffff;
      background: linear-gradient(90deg, #0865e9, #159dff);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.15);
      transform: translateY(-1px);
    }

    #resultado {
      display: none;
      margin-top: 22px;
      padding: 18px 12px;
      border: 1px solid #1677ff;
      border-radius: 10px;
      background: #07152b;
    }

    .key-label {
      margin-bottom: 12px;
      color: #8ebfff;
      font-size: 12px;
      letter-spacing: 2px;
    }

    #key {
      margin-bottom: 16px;
      color: #55c2ff;
      font-size: 21px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .copy-button {
      padding: 12px;
      background: #102d50;
      border: 1px solid #268bff;
    }

    .footer {
      margin-top: 23px;
      color: #6f85a5;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">TNT</div>

    <h1>TNT WIRE</h1>
    <p class="subtitle">
      GERADOR DE KEY<br>
      Clique no botão abaixo para obter sua key.
    </p>

    <button onclick="gerarKey()">GERAR KEY</button>

    <section id="resultado">
      <p class="key-label">SUA KEY</p>
      <div id="key">TNT-WIRE-4628</div>
      <button class="copy-button" onclick="copiarKey()">
        COPIAR KEY
      </button>
    </section>

    <p class="footer">TNT WIRE © 2026</p>
  </main>

  <script>
    const KEY_FIXA = "TNT-WIRE-4628";

    function gerarKey() {
      document.getElementById("key").textContent = KEY_FIXA;
      document.getElementById("resultado").style.display = "block";
    }

    function copiarKey() {
      navigator.clipboard.writeText(KEY_FIXA)
        .then(() => alert("Key copiada com sucesso!"))
        .catch(() => alert("Sua key é: " + KEY_FIXA));
    }
  </script>
</body>
</html>
