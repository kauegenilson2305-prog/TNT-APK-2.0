<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TNT APK 2.0</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 90%;
      max-width: 420px;
      padding: 30px 20px;
      background: #171717;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0 0 25px;
      font-size: 28px;
    }

    .key {
      width: 100%;
      padding: 18px 10px;
      margin-bottom: 20px;
      background: #242424;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #gerar {
      background: white;
      color: black;
    }

    #copiar {
      background: #333;
      color: white;
    }

    #status {
      min-height: 20px;
      margin-top: 15px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>TNT APK 2.0</h1>

    <div class="key" id="key">
      TNT_VIP-4567
    </div>

    <button id="gerar">
      GERAR KEY
    </button>

    <button id="copiar">
      COPIAR
    </button>

    <div id="status"></div>

  </div>

  <script>

    const keys = [
      "TNT_VIP-4567",
      "TNT_VIP-9769",
      "TNT_VIP-5775",
      "TNT_VIP-7080",
      "TNT_VIP-2305",
      "TNT_VIP-8668",
      "TNT_VIP-2644"
    ];

    let indice = 0;

    const keyElement = document.getElementById("key");
    const gerarButton = document.getElementById("gerar");
    const copiarButton = document.getElementById("copiar");
    const statusElement = document.getElementById("status");

    gerarButton.addEventListener("click", function () {

      indice++;

      if (indice >= keys.length) {
        indice = 0;
      }

      keyElement.textContent = keys[indice];
      statusElement.textContent = "";

    });

    copiarButton.addEventListener("click", async function () {

      const keyAtual = keys[indice];

      try {

        await navigator.clipboard.writeText(keyAtual);

        statusElement.textContent = "KEY COPIADA!";

        setTimeout(function () {
          statusElement.textContent = "";
        }, 1500);

      } catch (erro) {

        const campo = document.createElement("textarea");

        campo.value = keyAtual;
        document.body.appendChild(campo);

        campo.select();
        document.execCommand("copy");

        campo.remove();

        statusElement.textContent = "KEY COPIADA!";

        setTimeout(function () {
          statusElement.textContent = "";
        }, 1500);
      }

    });

  </script>

</body>
</html>
